<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Bites</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-leaf-fill"></i> Fit Bites</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#recetas">Recetas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Mi día</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- PORTADA -->
    <header class="py-5">
        <div class="container">
            <p class="text-uppercase small fw-bold mb-2 etiqueta">Recetas con macros</p>
            <h1 class="display-4 mb-3">Come bien, sabiendo lo que comes.</h1>
            <p class="lead mb-4">Tus recetas fit, con calorías y proteínas a la vista.</p>
            <a href="#recetas" class="btn btn-verde btn-lg">Ver recetas</a>
        </div>
    </header>

    <!-- RECETAS (en el paso 2 las pintará JavaScript) -->
    <section id="recetas" class="py-5">
        <div class="container">
            <h2 class="mb-4">Mis recetas</h2>
            <div id="listaRecetas" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
        </div>
    </section>

    <footer class="py-4 border-top">
        <div class="container small text-body-secondary">
            Valores nutricionales aproximados, introducidos por Tania y Cris.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/app.js"></script>

</html>
